<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Enrollment Form</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5" style="max-width:680px"><div class="card shadow-sm"><div class="card-header bg-primary text-white"><h1 class="h3 mb-0">Student Enrollment Form</h1></div><div class="card-body p-4"><p class="text-secondary">SCHOOL-DB · STUDENT-TABLE</p><button id="configure" class="btn btn-outline-secondary btn-sm mb-3" type="button">Configure JPDB token</button><div id="status" role="status" aria-live="polite" class="alert alert-secondary">Enter Roll No and press Enter or Tab.</div><form id="form"><div class="mb-3"><label for="roll" class="form-label">Roll No</label><input id="roll" class="form-control" required autofocus></div><div class="mb-3"><label for="name" class="form-label">Full Name</label><input id="name" class="form-control" required disabled></div><div class="mb-3"><label for="class" class="form-label">Class</label><input id="class" class="form-control" required disabled></div><div class="mb-3"><label for="birth" class="form-label">Birth Date</label><input id="birth" type="date" class="form-control" required disabled></div><div class="mb-3"><label for="address" class="form-label">Address</label><textarea id="address" class="form-control" required disabled></textarea></div><div class="mb-3"><label for="enrollment" class="form-label">Enrollment Date</label><input id="enrollment" type="date" class="form-control" required disabled></div><div class="d-flex gap-2"><button type="button" id="save" class="btn btn-success" disabled>Save</button><button type="button" id="update" class="btn btn-primary" disabled>Update</button><button type="button" id="reset" class="btn btn-outline-danger" disabled>Reset</button></div></form></div></div></main><script src="js/script.js"></script></body></html>
